name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            arch: x86_64
          - name: macOS arm64
            os: macos-latest
            arch: arm64
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Check runner architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Forbidden-API guard
        run: bash scripts/check-forbidden-apis.sh

      - name: Linux game dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config zlib1g-dev libsdl2-dev libsdl2-image-dev libopenal-dev libsndfile1-dev libgl1-mesa-dev libfreetype-dev

      - name: macOS game dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config sdl2 sdl2_image openal-soft libsndfile freetype

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure
